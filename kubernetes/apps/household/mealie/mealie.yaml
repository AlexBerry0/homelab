apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-data
  namespace: household
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: household
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.28.0
          ports:
            - containerPort: 9000
          env:
            - name: ALLOW_SIGNUP
              value: "true"
            - name: BASE_URL
              value: "http://mealie.192.168.64.2.nip.io"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
---
apiVersion: v1
kind: Service
metadata:
  name: mealie
  namespace: household
spec:
  selector:
    app: mealie
  ports:
    - port: 9000
      targetPort: 9000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie
  namespace: household
spec:
  ingressClassName: traefik
  rules:
    - host: mealie.192.168.64.2.nip.io
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: mealie
                port:
                  number: 9000
