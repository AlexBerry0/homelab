apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://grafana.github.io/helm-charts"
    chart: grafana
    targetRevision: 14.0.0
    helm:
      valuesObject:
        adminPassword: "admin"
        persistence:
          enabled: true
          storageClassName: local-path
          size: 2Gi
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: VictoriaMetrics
                type: prometheus
                access: proxy
                url: http://vmsingle-victoria-metrics-single-server.monitoring.svc:8428
                isDefault: true
        ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
            - grafana.192.168.64.2.nip.io
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
