apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homeassistant
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "git@github.com:AlexBerry0/homelab.git"
    targetRevision: main
    path: kubernetes/apps/household/homeassistant
  destination:
    server: "https://kubernetes.default.svc"
    namespace: household
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
